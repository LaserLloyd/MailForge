name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (dev tools only, no heavy extras)
        # Deliberately NOT --extra security-ml / llm: Prompt Guard, Presidio,
        # sqlite-vec and the LM Studio bridge are optional tiers with documented
        # heuristic fallbacks, so CI proves the fallbacks work rather than
        # hiding behind the heavy stack (and skips multi-GB model downloads).
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
