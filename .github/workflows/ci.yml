name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  privacy:
    # Blocking, and deliberately first: everything else is a quality question,
    # this one is a "did private data leave the machine" question.
    #
    # CI never has scripts/scrub-rules.local.txt — that file is git-ignored
    # precisely because publishing the list of words that must never be
    # published is its own leak. So this job proves the GENERIC rules only
    # (home paths, tailnet hosts, private/CGNAT IPs, real email addresses,
    # keys and secret-shaped strings, assistant session URLs and trailers).
    # The scanner says so on stderr rather than letting a clean run read as
    # "no private data". The name and hostname rules run on the maintainer's
    # clone, through the git hooks in scripts/hooks/.
    name: no private data
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the commit-range step needs the PR's base
      # commit; the default shallow clone does not contain it and the scan
      # would fail with "unknown revision" on every pull request.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prove the scanner still works
        run: python3 scripts/scrub_check.py --self-test

      - name: Scan the tree
        run: |
          python3 scripts/scrub_check.py \
            src tests scripts docs installer packaging .github \
            README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md \
            THIRD_PARTY_NOTICES.md pyproject.toml

      - name: Scan the TREE of every commit in the pull request
        if: github.event_name == 'pull_request'
        # Not just the head: a secret added in one commit and removed in the
        # next still publishes, and a head-only scan calls that clean.
        run: |
          for sha in $(git rev-list --reverse \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            python3 scripts/scrub_check.py --rev "$sha"
          done

      - name: Scan the commit messages in the pull request
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/scrub_check.py --commit-range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to a full version, not a bare major: astral-sh/setup-uv
        # stopped publishing moving major tags after v7, so `@v10` is an
        # unresolvable ref and every run dies at "Unable to resolve action".
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync (dev tools only, no heavy extras)
        # Deliberately NOT --extra security-ml / llm: Prompt Guard, Presidio,
        # sqlite-vec and the LM Studio bridge are optional tiers with documented
        # heuristic fallbacks, so CI proves the fallbacks work rather than
        # hiding behind the heavy stack (and skips multi-GB model downloads).
        run: uv sync --frozen --extra dev

      - name: Vendored ForgeUI bundle matches forgeui.json
        # ui/static/ui-theme/ is the ForgeUI (ThemeForge) bundle, vendored whole. This fails
        # on a different version, a stale or hand-edited bundle file, or settings naming a
        # theme the bundle lacks. Fix: `python -m forgeui vendor` (docs/STYLE-GUIDE.md,
        # section 2). forgeui comes from the release tag, not PyPI (that name belongs to
        # another project); it is a dev tool, not a dependency of the app.
        run: |
          # ForgeUI 1.2.0 pinned to the ThemeForge commit; switch to @v1.2.0 once that tag exists (OWNER_ACTIONS #22)
          uv pip install "forgeui @ git+https://github.com/LaserLloyd/ThemeForge@d70f6608bdf386fc095d43fc1caec61e88664795"  # scrub-check: allow (git commit pin, not a secret)
          uv run --no-sync python -m forgeui vendor --check

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        env:
          # tests/unit/test_forgeui_vendor.py runs `forgeui vendor --check` too; with this set a
          # missing forgeui package fails the test instead of skipping it.
          FORGEUI_REQUIRED: "1"
        run: uv run --no-sync pytest -q --junitxml=pytest-results.xml

      - name: Annotate test failures
        # Job logs need a signed-in browser or a token; annotations are on
        # the public run page and API. One ::error line per failing test.
        if: always()
        run: python scripts/junit_annotations.py pytest-results.xml
