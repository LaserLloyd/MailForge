# Optional override: a bind-mounted DATA_PATH owned by a UID other than 1000.
#
#   PUID=$(id -u) PGID=$(id -g) \
#   docker compose -f deploy/compose/compose.yml -f deploy/compose/compose.puid.yml up -d
#
# The container starts as root, chowns /data to PUID:PGID, then drops to that
# user with setpriv before the app runs. The few capabilities it needs for that
# are added back here and nowhere else; the app process itself ends up with none.
services:
  app:
    user: "0:0"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
