# MailForge - Docker Compose
#
#   cp deploy/compose/.env.example deploy/compose/.env && chmod 0600 deploy/compose/.env
#   $EDITOR deploy/compose/.env                      # set MAILFORGE_KEYRING_PASSWORD
#   docker compose -f deploy/compose/compose.yml up -d
#   docker compose -f deploy/compose/compose.yml logs app | grep "MailForge UI"   # one-shot login URL
#
# First-time setup of a real mailbox (interactive; credentials go to the
# encrypted store in the data volume, never into the image or the compose file):
#   docker compose -f deploy/compose/compose.yml run --rm -it app setup-wizard
# Look around with fictional data first (no mailbox, nothing stored):
#   docker compose -f deploy/compose/compose.yml run --rm -p 127.0.0.1:8091:8091 \
#       -e MAILFORGE_UI_PORT=8091 app demo --no-browser
name: mailforge

services:
  app:
    image: ${IMAGE:-mailforge:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        EXTRAS: ${EXTRAS:-llm rag}
    container_name: mailforge
    hostname: mailforge
    restart: unless-stopped
    init: true                      # tini as PID 1: signal forwarding + zombie reaping
    stop_grace_period: 30s

    ports:
      # MailForge is a localhost-only app by design (one-shot login token, Host
      # guard). The container keeps that: publish on the host's loopback.
      # Set BIND_ADDR=0.0.0.0 only behind something that authenticates users.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8090}:8090"

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
      # The local LLM server, as seen from the container. Reduced to host:port
      # for MailForge's [llm] lm_studio_host by the entrypoint.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      # Unlocks the encrypted credential store. NOT baked into the image.
      # Prefer the _FILE form with a Docker/compose secret for anything shared.
      MAILFORGE_KEYRING_PASSWORD: ${MAILFORGE_KEYRING_PASSWORD:-}
      MAILFORGE_KEYRING_PASSWORD_FILE: ${MAILFORGE_KEYRING_PASSWORD_FILE:-}
      # The browser's Host header carries the PUBLISHED port, which differs from
      # the container's 8090 whenever HOST_PORT is changed; MailForge's Host
      # guard must be told, or every page answers 403.
      MAILFORGE_UI_ALLOWED_HOSTS: localhost:${HOST_PORT:-8090},127.0.0.1:${HOST_PORT:-8090}${UI_EXTRA_HOSTS:+,${UI_EXTRA_HOSTS}}

    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # Resolve host.docker.internal on Linux engines too (Docker Desktop has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # config, the mail database, the encrypted credential store, attachments.
      # Set DATA_PATH to a host directory (owned by UID 1000) to browse/back it up.
      - ${DATA_PATH:-mailforge-data}:/data

    healthcheck:
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-1g}
          cpus: "${CPU_LIMIT:-2.0}"
        reservations:
          memory: ${MEM_RESERVATION:-256m}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mailforge-data:
