[project]
name = "mailforge"
version = "0.4.0"
description = "Self-contained, cross-platform local-LLM email triage & auto-draft assistant (no auto-send)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Laser Lloyd" }]
urls = { Homepage = "https://www.laserlloyd.com" }

# Core runtime dependencies. These are required for the package to import and
# for the setup-wizard / serve loop to function. Heavy ML security models are
# in the optional `security-ml` group so a base install stays light and the
# package degrades gracefully when a model is absent (see security/*).
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "keyring>=25",
    "keyrings.cryptfile>=1.3",
    "imap-tools>=1.15",
    "nicegui>=3.18,<4",
    "markdown2>=2.5",
    "lxml_html_clean>=0.1",
    "bleach>=6.4",
    "html2text>=2024.2.26",
    "ftfy>=6.2",
    "tldextract>=5.1",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "httpx>=0.27",
    # Transitive (via nicegui/fastapi), floored for known advisories:
    # python-multipart <0.0.31 and starlette <1.3.1.
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
# Local-LLM runtime bridge (LM Studio SDK). Optional so the package installs
# on machines without LM Studio; bridge.py degrades to DEFERRED_NO_LLM.
llm = ["lmstudio>=1.5.0"]
# Vector / RAG.
rag = ["sqlite-vec>=0.1.6", "markitdown>=0.0.1"]
# Heavy ML guardrails (large model downloads). Architecture works without them
# but with reduced detection depth; each module import-guards on these.
security-ml = [
    "llm-guard>=0.3.15",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "detect-secrets>=1.5",
    "transformers>=4.40",
    "torch>=2.2",
]
# Offline flow policy engine.
policy = ["invariant-ai>=0.1"]
# Packaging fallback (folder-mode only, never onefile).
package = ["pyinstaller>=6.0"]
# Red-team CI.
redteam = ["garak>=0.9", "promptfoo>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
mailforge = "mailforge.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# security-ml's llm-guard 0.3.16 pins presidio-anonymizer 2.2.358, which needs
# cryptography<44.1 (5 advisories); the lock is universal, so that pin would
# drag keyring/secretstorage in every install down with it. Keep the fixed
# cryptography and let llm-guard resolve to 0.3.15.
constraint-dependencies = ["cryptography>=46"]

[tool.ruff]
line-length = 100
target-version = "py312"
